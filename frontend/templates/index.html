{% extends "base.html" %}
{% block title %}Home{% endblock %}
{% block content %}
<div class="text-center mt-5">
    <h1 class="display-4">Welcome to AI Mock Interview</h1>
    <p class="lead">Practice with AI, get instant feedback, track your progress.</p>
    {% if not current_user.is_authenticated %}
        <a href="{{ url_for('auth.register') }}" class="btn btn-primary btn-lg">Get Started</a>
        <a href="{{ url_for('auth.login') }}" class="btn btn-outline-secondary btn-lg">Login</a>
    {% else %}
        <a href="{{ url_for('user.dashboard') }}" class="btn btn-primary btn-lg">Go to Dashboard</a>
    {% endif %}
</div>
{% endblock %}
