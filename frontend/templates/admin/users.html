{% extends "base.html" %}
{% block title %}Manage Users{% endblock %}
{% block content %}
<h2>All Users</h2>
<table class="table table-bordered mt-3">
    <thead>
        <tr><th>ID</th><th>Username</th><th>Email</th><th>Role</th><th>Joined</th></tr>
    </thead>
    <tbody>
        {% for u in users %}
        <tr>
            <td>{{ u.id }}</td>
            <td>{{ u.username }}</td>
            <td>{{ u.email }}</td>
            <td>{{ u.role.name }}</td>
            <td>{{ u.created_at.strftime('%Y-%m-%d') }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
