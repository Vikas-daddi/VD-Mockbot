{% extends "base.html" %}
{% block title %}Admin Dashboard{% endblock %}
{% block content %}
<h2>Admin Panel</h2>
<div class="row mt-4">
    <div class="col-md-3">
        <div class="card text-white bg-primary mb-3"><div class="card-body"><h5>Total Users</h5><p class="display-4">{{ total_users }}</p></div></div>
    </div>
    <div class="col-md-3">
        <div class="card text-white bg-success mb-3"><div class="card-body"><h5>Total Sessions</h5><p class="display-4">{{ total_sessions }}</p></div></div>
    </div>
    <div class="col-md-3">
        <div class="card text-white bg-info mb-3"><div class="card-body"><h5>Completed Sessions</h5><p class="display-4">{{ completed_sessions }}</p></div></div>
    </div>
    <div class="col-md-3">
        <div class="card text-white bg-warning mb-3"><div class="card-body"><h5>Avg Final Score</h5><p class="display-4">{{ "%.1f"|format(avg_score) }}</p></div></div>
    </div>
</div>
<a href="{{ url_for('admin.users') }}" class="btn btn-secondary">Manage Users</a>
{% endblock %}
